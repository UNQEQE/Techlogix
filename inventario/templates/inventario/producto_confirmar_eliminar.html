{% extends 'inventario/base.html' %}
{% block title %}Eliminar producto{% endblock %}

{% block content %}
<div class="card form-card confirm">
  <h1>¿Eliminar este producto?</h1>
  <p>Vas a eliminar <strong>{{ producto.nombre }}</strong> (SKU <code>{{ producto.sku }}</code>). Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button type="submit" class="btn btn--danger">Sí, eliminar</button>
      <a href="{% url 'admin_panel' %}" class="btn btn--ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
